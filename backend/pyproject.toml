[project]
name = "document-intelligence-api"
version = "0.1.0"
description = "Modular-monolith backend for AI Document Intelligence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "celery>=5.4,<6",
  "cryptography>=50,<51",
  "email-validator>=2.3,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pypdf>=5.0,<7",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-docx>=1.1,<2",
  "redis>=5,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "workos>=10.3,<11",
  "resend>=2.44,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
