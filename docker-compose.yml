x-backend: &backend
  image: arquivio-backend:local
  build:
    context: ./backend

services:
  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: document_intelligence
      POSTGRES_USER: document_intelligence
      POSTGRES_PASSWORD: document_intelligence
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_intelligence -d document_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://document_intelligence:document_intelligence@postgres:5432/document_intelligence
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      # The API exposes this same public configuration on the Developer page.
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-}
      MCP_ISSUER_URL: ${MCP_ISSUER_URL:-}
      MCP_JWKS_URL: ${MCP_JWKS_URL:-}
      MCP_STATIC_KEY_ENABLED: ${MCP_STATIC_KEY_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_TOOLS_ENABLED: ${AGENT_TOOLS_ENABLED:-true}
      AGENT_INTENT_ENGINE: ${AGENT_INTENT_ENGINE:-jev}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-pgvector}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      EVIDENCE_CONTEXT_CHARS: ${EVIDENCE_CONTEXT_CHARS:-64000}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/data-sources/google/oauth/callback}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_REDIRECT_URI: ${MICROSOFT_OAUTH_REDIRECT_URI:-http://localhost:8000/data-sources/onedrive/oauth/callback}
      MICROSOFT_SHAREPOINT_REDIRECT_URI: ${MICROSOFT_SHAREPOINT_REDIRECT_URI:-http://localhost:8000/data-sources/sharepoint/oauth/callback}
      SHAREPOINT_DOWNLOAD_WORKERS: ${SHAREPOINT_DOWNLOAD_WORKERS:-2}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-104857600}
      SHAREPOINT_CATALOG_MAX_SITES: ${SHAREPOINT_CATALOG_MAX_SITES:-200}
      MICROSOFT_TOKEN_ENCRYPTION_KEY: ${MICROSOFT_TOKEN_ENCRYPTION_KEY:-}
      NOTION_OAUTH_CLIENT_ID: ${NOTION_OAUTH_CLIENT_ID:-}
      NOTION_OAUTH_CLIENT_SECRET: ${NOTION_OAUTH_CLIENT_SECRET:-}
      NOTION_OAUTH_REDIRECT_URI: ${NOTION_OAUTH_REDIRECT_URI:-http://localhost:8000/data-sources/notion/oauth/callback}
      NOTION_TOKEN_ENCRYPTION_KEY: ${NOTION_TOKEN_ENCRYPTION_KEY:-}
      NOTION_TOKEN_ENCRYPTION_LEGACY_FALLBACK: ${NOTION_TOKEN_ENCRYPTION_LEGACY_FALLBACK:-true}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_REDIRECT_URI: ${WORKOS_REDIRECT_URI:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      INVITATION_FROM_EMAIL: ${INVITATION_FROM_EMAIL:-}
      OCR_ENGINE: ${OCR_ENGINE:-none}
      DOCLING_SERVE_URL: ${DOCLING_SERVE_URL:-http://docling:5001}
      DOCLING_SERVE_VERSION: ${DOCLING_SERVE_VERSION:-v1.35.0-pt1}
      OCR_MAX_PAGES_PER_JOB: ${OCR_MAX_PAGES_PER_JOB:-200}
      OCR_JOB_DEADLINE_SECONDS: ${OCR_JOB_DEADLINE_SECONDS:-1200}
      OCR_MAX_PAGES_PER_DOCUMENT: ${OCR_MAX_PAGES_PER_DOCUMENT:-120}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    environment: *backend_environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    environment: *backend_environment
    command: ["celery", "-A", "app.ingestion.tasks", "worker", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Scheduler: enqueues the periodic reconciliation ("Agendamento automático" in the
  # sync history) and the extraction-cache purge. Exactly one beat per deployment.
  beat:
    <<: *backend
    environment: *backend_environment
    command: ["celery", "-A", "app.ingestion.tasks", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Optional remote MCP server (docker compose --profile mcp up mcp). Needs the MCP_* variables;
  # without them the process refuses to start, so it stays out of the default stack.
  mcp:
    <<: *backend
    profiles: ["mcp"]
    environment:
      <<: *backend_environment
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-}
      MCP_ISSUER_URL: ${MCP_ISSUER_URL:-}
      MCP_JWKS_URL: ${MCP_JWKS_URL:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_RATE_LIMIT_PER_MINUTE: ${MCP_RATE_LIMIT_PER_MINUTE:-60}
      MCP_STATIC_KEY_ENABLED: ${MCP_STATIC_KEY_ENABLED:-false}
    command: ["uvicorn", "app.mcp_server.asgi:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Optional OCR sidecar (docker compose --profile ocr up --build docling). Image derived from
  # docling-serve v1.35.0 (pinned by digest) plus the Tesseract `por` model: infra/docling/Dockerfile.
  # Memory limit is the measured peak RSS (~2.5 GiB with 8-page batches, ~3.8 GiB when 504 retries pile up duplicate
  # conversions) plus headroom.
  docling:
    build: ./infra/docling
    image: ${DOCLING_SERVE_IMAGE:-arquivio-docling:v1.35.0-pt1}
    profiles: ["ocr"]
    ports:
      - "127.0.0.1:5001:5001"
    deploy:
      resources:
        limits:
          memory: 6g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    image: arquivio-frontend:local
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
