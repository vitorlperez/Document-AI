name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: document_intelligence
          POSTGRES_USER: document_intelligence
          POSTGRES_PASSWORD: document_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U document_intelligence -d document_intelligence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://document_intelligence:document_intelligence@localhost:5432/document_intelligence
      TEST_DATABASE_URL: postgresql+psycopg://document_intelligence:document_intelligence@localhost:5432/document_intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q tests/unit tests/api
      - name: Check public OpenAPI contract
        working-directory: backend
        run: python scripts/export_openapi.py --check
      - name: Run PostgreSQL integration tests
        working-directory: backend
        run: python -m pytest -q -m postgres tests/integration
      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Verify a single migration head
        working-directory: backend
        run: |
          alembic heads | tee /tmp/alembic-heads.txt
          test "$(wc -l < /tmp/alembic-heads.txt | tr -d ' ')" -eq 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm run install:ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
