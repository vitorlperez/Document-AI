services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: document_intelligence
      POSTGRES_USER: document_intelligence
      POSTGRES_PASSWORD: document_intelligence
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_intelligence -d document_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
